[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexora-dot-x"
version = "0.1.0"
description = "Self-hosted local-first autonomous AI agent runtime"
requires-python = ">=3.12"
dependencies = [
  "python-fasthtml>=0.12",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "websockets>=12",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
vector = ["faiss-cpu>=1.8"]
litert = ["litert-lm"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
nexora = "nexora.cli:main"

[tool.setuptools.packages.find]
include = ["nexora*"]
