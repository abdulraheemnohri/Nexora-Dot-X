[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexora-dot-x"
version = "0.1.0"
description = "Self-hosted local-first autonomous AI agent runtime"
requires-python = ">=3.12"
dependencies = [
  "python-fasthtml>=0.12",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "websockets>=12",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
vector = ["faiss-cpu>=1.8"]
litert = ["litert-lm"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
nexora = "nexora.cli:main"

[tool.setuptools.packages.find]
include = ["nexora*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Pin ruff to its documented default core rules: pyflakes + key pycodestyle.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# fasthtml's star import is the framework idiom for app modules.
"nexora/server.py" = ["F403", "F405"]
"nexora/ui/wizard.py" = ["F403", "F405"]
"nexora/ui/pages_extra.py" = ["F403", "F405"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
